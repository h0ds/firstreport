# Français. Mêmes identifiants, mêmes faits, mêmes citations que l'anglais ;
# seule la phrase change. Tenu à docs/voice.md.

[burst]
needs = ["d.obs.burst.count", "d.obs.burst.window", "d.obs.burst.subject"]
text = "{d.obs.burst.count} comptes ont publié ce lien en {d.obs.burst.window}."
cite = "observation:burst:{d.obs.burst.subject}"

[syndicated_text]
needs = ["d.obs.syndicated_text.count", "d.obs.syndicated_text.denominator", "d.obs.syndicated_text.subject"]
text = "{d.obs.syndicated_text.count} de ces {d.obs.syndicated_text.denominator} publications portent la même formulation."
cite = "observation:syndicated_text:{d.obs.syndicated_text.subject}"

[cohort]
needs = ["d.obs.cohort.count", "d.obs.cohort.denominator", "d.obs.cohort.span_days", "d.obs.cohort.baseline_pct", "d.obs.cohort.subject"]
text = "{d.obs.cohort.count} des {d.obs.cohort.denominator} comptes dont la date de création est connue ont été créés à moins de {d.obs.cohort.span_days} jours les uns des autres ; sur l'ensemble des comptes que Kagami a vus, cette part est de {d.obs.cohort.baseline_pct}."
cite = "observation:cohort:{d.obs.cohort.subject}"
