# Français. Mêmes identifiants, mêmes faits, mêmes citations que l'anglais ;
# seule la phrase change. Tenu à docs/voice.md.

[outlet_unseen]
needs = ["d.outlet_name", "lookup.outlet.id"]
when = "lookup.matched == outlet"
text = "Kagami suit {d.outlet_name} mais n'a pas vu ce lien dans ses flux."
cite = "feed:outlet:{lookup.outlet.id}"

[not_followed]
needs = ["lookup.host"]
when = "lookup.matched == none"
text = "{lookup.host} n'est pas un média que Kagami suit."
cite = "reply:lookup:{mention.id}"

[domain_age]
needs = ["d.ledger.domain_registered.value", "d.ledger.domain_registered.source", "d.ledger_outlet"]
text = "Son domaine a été enregistré le {d.ledger.domain_registered.value}, selon {d.ledger.domain_registered.source}."
cite = "ledger:{d.ledger_outlet}:domain_registered"

[owner]
needs = ["d.ledger.owner.value", "d.ledger.owner.source", "d.ledger_outlet"]
text = "Propriétaire déclaré : {d.ledger.owner.value}, selon {d.ledger.owner.source}."
cite = "ledger:{d.ledger_outlet}:owner"
