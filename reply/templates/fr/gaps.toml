# Français. Mêmes identifiants, mêmes faits, mêmes citations que l'anglais ;
# seule la phrase change. Tenu à docs/voice.md.

[text_match]
needs = ["d.origin_outlet", "d.origin_time", "lookup.cluster.id"]
when = "lookup.matched == text"
text = "Pas de lien à vérifier, mais cette formulation correspond à un article publié d'abord par {d.origin_outlet} le {d.origin_time}."
cite = "feed:cluster:{lookup.cluster.id}"

[no_story]
needs = ["d.checked"]
when = "lookup.matched == none"
text = "Kagami n'a aucun article pour cela. Vérifié : {d.checked}."
cite = "reply:lookup:{mention.id}"

[nothing_to_check]
needs = ["d.gaps"]
when = "d.has_lookup == false"
text = "Rien à vérifier : {d.gaps}."
cite = "reply:lookup:{mention.id}"
