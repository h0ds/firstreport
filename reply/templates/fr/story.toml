# Français. Mêmes identifiants, mêmes faits, mêmes citations que l'anglais ;
# seule la phrase change. Tenu à docs/voice.md.

[origin]
needs = ["d.origin_outlet", "d.origin_time", "lookup.cluster.id"]
when = "lookup.matched == item"
text = "Publié d'abord par {d.origin_outlet} le {d.origin_time}."
cite = "feed:item:{lookup.cluster.origin_item_id}"

[this_is_origin]
needs = ["lookup.is_origin", "lookup.item.id"]
when = "lookup.is_origin == true"
text = "Ce lien est cette première publication."
cite = "feed:item:{lookup.item.id}"

[this_is_later]
needs = ["lookup.is_origin", "lookup.item.id", "d.outlet_name"]
when = "lookup.is_origin == false"
text = "Ce lien est la copie de {d.outlet_name}, publiée plus tard."
cite = "feed:item:{lookup.item.id}"

[spread]
needs = ["d.outlet_count", "d.t5", "lookup.cluster.id"]
when = "d.outlet_count >= 5"
text = "Repris par {d.outlet_count} médias ; cinq en {d.t5} après le premier."
cite = "feed:cluster:{lookup.cluster.id}"

[spread_small]
needs = ["d.outlet_count", "d.outlets_word", "d.carried_by", "lookup.cluster.id"]
when = "d.outlet_count < 5"
text = "Kagami l'a vu chez {d.outlet_count} {d.outlets_word} : {d.carried_by}."
cite = "feed:cluster:{lookup.cluster.id}"

[syndication]
needs = ["d.syn_share_pct", "d.syn_first_outlet", "lookup.cluster.id"]
when = "d.syn_share >= 0.5"
text = "{d.syn_share_pct} de ces articles portent le même texte, vu d'abord chez {d.syn_first_outlet} ; c'est une seule copie, pas un travail indépendant."
cite = "feed:cluster:{lookup.cluster.id}/syndication"
