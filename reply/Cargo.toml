[package]
name = "reply"
description = "Kagami pillar 4: sourced provenance answers on social media, never a verdict"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reply"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "system-proxy", "json", "query"] }
