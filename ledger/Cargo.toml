[package]
name = "ledger"
description = "Kagami pillar 2: sourced facts about outlets, never a score"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ledger"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "system-proxy", "query"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
