# Source registry (plan §2, §4). Every claim names one of these ids.
# `refresh_days` drives `ledger check` staleness and `ledger refresh`;
# 0 means no schedule. `no_redistribution = true` makes `check` refuse
# the source's claims until its terms are confirmed.

[[source]]
id = "wikidata"
name = "Wikidata"
url = "https://www.wikidata.org"
licence = "CC0-1.0"
kind = "database"
notes = "Owner, parent company, country, founding date, legal form, website and Wikipedia link. Public domain."
refresh_days = 90

[[source]]
id = "wikipedia_rsp"
name = "Wikipedia: Reliable sources/Perennial sources"
url = "https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources/Perennial_sources"
licence = "CC-BY-SA-4.0"
kind = "community"
notes = "Wikipedia editors' consensus on how reliable each source is, with their status, summary and links to the discussions. Reuse needs attribution and the same licence."
refresh_days = 30

[[source]]
id = "rdap"
name = "Domain registries (RDAP)"
url = "https://about.rdap.org"
licence = "public registration data"
kind = "observed"
notes = "When each outlet's domain was registered, the registrar, and the domain's status, from the registry."
refresh_days = 180

[[source]]
id = "site"
name = "Outlet home page"
url = "https://github.com/h0ds/kagami/tree/main/ledger"
licence = "Truth Decay observation"
kind = "observed"
notes = "Whether the outlet's site uses HTTPS, and which pages (about, contact, corrections, ethics, staff) its home page links to. A missing page means it isn't linked from the home page, not that it doesn't exist."
refresh_days = 30

[[source]]
id = "feed_behaviour"
name = "Truth Decay feed behaviour"
url = "https://github.com/h0ds/kagami/tree/main/feed"
licence = "Truth Decay observation"
kind = "observed"
notes = "How often the outlet posts, how often it edits or removes items, how much it copies and how often it's first. Outlets with fewer than ten items in the window are left out."
refresh_days = 7

[[source]]
id = "allsides"
name = "AllSides Media Bias Ratings"
url = "https://www.allsides.com/media-bias/ratings"
licence = "CC-BY-NC-4.0"
kind = "rating"
notes = "AllSides' rating of each outlet from Left to Right, using their own method. Non-commercial use only. Attribution: \"AllSides Media Bias Ratings™ by AllSides.com are licensed under a Creative Commons Attribution-NonCommercial 4.0 International License.\" AllSides sends the data on request (admin@allsides.com); import it with `ledger import allsides --file <file>`."
# Supplied as a file, so not on a refresh schedule: re-import when AllSides sends a new one.
refresh_days = 0

[[source]]
id = "robertson2018"
name = "Partisan audience bias scores (Robertson et al. 2018)"
url = "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/QAN5VX"
licence = "CC0-1.0"
kind = "database"
notes = "Scores from -1 to +1 for about 19,000 websites, based on whether Democrats or Republicans shared their links on Twitter in 2017. This measures the audience, not the content. Robertson, Jiang, Joseph, Friedland, Lazer and Wilson (2018), Auditing Partisan Audience Bias within Google Search."
refresh_days = 0

[[source]]
id = "state_media_monitor"
name = "State Media Monitor (MJRC)"
url = "https://statemediamonitor.com"
licence = "CC-BY-4.0"
kind = "database"
notes = "Classifies state media by ownership, funding and editorial control: State-Controlled (SC), Captured Public (CaPu), Captured Private (CaPr), and independent public media (IP, ISF, ISM, ISFM). Some entries cover a parent group, such as China Media Group for CGTN. Cite: Dragomir, M. (2025). State Media Monitor Global Dataset 2025. MJRC. DOI: 10.5281/zenodo.17219015."
refresh_days = 180

[[source]]
id = "eu_sanctions"
name = "EU restrictive measures (Council of the European Union)"
url = "https://eur-lex.europa.eu/eli/reg/2014/833/oj"
licence = "EU legal texts, free reuse (Commission Decision 2011/833/EU)"
kind = "legal"
notes = "Outlets the EU has banned from broadcasting under Regulation 833/2014, as part of sanctions against Russian state propaganda. Each claim links the regulation that named the outlet."
refresh_days = 0
