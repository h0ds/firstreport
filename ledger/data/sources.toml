# Source registry (plan §2, §4). Every claim names one of these ids.
# `refresh_days` drives `ledger check` staleness and `ledger refresh`;
# 0 means no schedule. `no_redistribution = true` makes `check` refuse
# the source's claims until its terms are confirmed.

[[source]]
id = "wikidata"
name = "Wikidata"
url = "https://www.wikidata.org"
licence = "CC0-1.0"
kind = "database"
notes = "Ownership, parent, country, inception, legal form, website and Wikipedia link via SPARQL. Public domain; no restriction on reuse."
refresh_days = 90

[[source]]
id = "wikipedia_rsp"
name = "Wikipedia: Reliable sources/Perennial sources"
url = "https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources/Perennial_sources"
licence = "CC-BY-SA-4.0"
kind = "community"
notes = "Community consensus on reliability, one claim per matching row with the list's own status, scope, discussions and summary. Reuse requires attribution and share-alike."
refresh_days = 30

[[source]]
id = "rdap"
name = "Domain registries (RDAP)"
url = "https://about.rdap.org"
licence = "public registration data"
kind = "observed"
notes = "Registration date, registrar and status of each outlet's registrable domains, as reported by the registry's RDAP service. Facts observed by Kagami, not licensed content."
refresh_days = 180

[[source]]
id = "site"
name = "Outlet home page"
url = "https://github.com/h0ds/kagami/tree/main/ledger"
licence = "Kagami observation"
kind = "observed"
notes = "Whether the site serves HTTPS and redirects plain HTTP, and which accountability pages (about, contact, privacy, corrections, ethics, masthead) the home page links. Absence means not linked from the home page, not that the page does not exist."
refresh_days = 30

[[source]]
id = "feed_behaviour"
name = "Kagami feed behaviour"
url = "https://github.com/h0ds/kagami/tree/main/feed"
licence = "Kagami observation"
kind = "observed"
notes = "Posting cadence, revision and withdrawal rates, syndication share and origin share, measured from feed's own export. Each claim carries its window and counts; outlets with fewer than ten items in the window get none. Describes what a feed does, not whether that is good."
refresh_days = 7

[[source]]
id = "allsides"
name = "AllSides Media Bias Ratings"
url = "https://www.allsides.com/media-bias/ratings"
licence = "CC-BY-NC-4.0"
kind = "rating"
notes = "Left, Lean Left, Center, Lean Right, Right on AllSides' own scale, with published methodology. Terms of use (October 2025): the ratings are licensed CC BY-NC 4.0, usable for research or noncommercial purposes with attribution; commercial use needs AllSides' written consent. Required attribution: \"AllSides Media Bias Ratings™ by AllSides.com are licensed under a Creative Commons Attribution-NonCommercial 4.0 International License.\" AllSides supplies the ratings as CSV or JSON on request (admin@allsides.com); import with `ledger import allsides --file <file>`. Their style guide colours the labels blue to red; Kagami shows them in greys (design §5)."
# Supplied as a file, so not on a refresh schedule: re-import when AllSides sends a new one.
refresh_days = 0

[[source]]
id = "robertson2018"
name = "Partisan audience bias scores (Robertson et al. 2018)"
url = "https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/QAN5VX"
licence = "CC0-1.0"
kind = "database"
notes = "Scores from -1 (links shared only by Democrats) to +1 (only by Republicans) for ~19,000 web domains, from the sharing of ~500,000 US Twitter accounts of known party in 2017. A measure of an outlet's audience, not of its content, recorded as audience_partisanship. Only the authors' own score column is used; the file's other columns are other raters' scores under their own terms. Cite: Robertson, Jiang, Joseph, Friedland, Lazer, Wilson (2018), Auditing Partisan Audience Bias within Google Search, PACM HCI 2(CSCW)."
refresh_days = 0
