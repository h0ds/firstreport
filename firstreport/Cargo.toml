[package]
name = "firstreport"
description = "Runs the First Report tools together: feed and ledger as one command, and the export-then-build step that makes the site"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "firstreport"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time"] }
