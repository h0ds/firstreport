[poll]
default_interval_secs = 900
global_concurrency = 64
per_host_concurrency = 2
max_backoff_secs = 21600
adaptive = true                  # speed up feeds that yield items, slow down quiet ones
min_interval_secs = 300
max_interval_secs = 3600
jitter = 0.1                     # ±10% so feeds don't poll in lockstep
per_host_requests_per_hour = 240 # request budgets (docs/steward.md §5): a request over budget waits; 0 disables
global_requests_per_hour = 20000

[embed]
backend = "onnx"                 # onnx | hash (deterministic, model-free, for replay and CI)
model_path = "models/minilm-l6-int8.onnx"
vocab_path = "models/vocab.txt"
# runtime_lib defaults to models/libonnxruntime.so (.dylib on macOS, onnxruntime.dll on Windows); populated by `feed fetch-model`
max_tokens = 128
batch_size = 64
batch_wait_ms = 200
pooling = "mean"                 # mean (MiniLM, gte, e5) | cls (bge)
tokenizer = "wordpiece"          # wordpiece (vocab.txt) | unigram (sentencepiece.bpe.model)
preset = "minilm-l6"             # what fetch-model downloads: minilm-l6 (English) | multilingual-minilm-l12 (50 languages incl. Japanese)
input_template = "{title} . {summary}"
# model_url / vocab_url / runtime_url: leave unset to pick by preset and target triple
#
# English and Japanese together: swap the four lines above for
#   model_path = "models/multilingual-minilm-l12-int8.onnx"
#   vocab_path = "models/sentencepiece.bpe.model"
#   tokenizer  = "unigram"
#   preset     = "multilingual-minilm-l12"
# run `feed fetch-model` again, add "ja" to cluster.languages, and re-check
# cluster.join_threshold against the golden sets (docs/clustering.md).

[cluster]
join_threshold = 0.72
merge_threshold = 0.80
window_secs = 259200
expiry_secs = 172800
merge_interval_secs = 600
max_cluster_size = 500
same_outlet_guard = true
languages = ["en"]

[store]
path = "data/feed.db"
checkpoint_secs = 60

[snapshots]
enabled = true
dir = "data/snapshots"
zstd_level = 3
retention_days = 180
max_bytes = 0                    # disk budget for snapshots, bytes; whole days go oldest first; 0 = none

[syndication]
hamming_threshold = 3

[api]
bind = "127.0.0.1:8080"
ledger_url = "http://127.0.0.1:8081"   # Kagami ledger, for links from outlets to their sourced facts; "" disables

[export]
nightly = false                  # daily export into out_dir/<yyyy-mm-dd> plus snapshot retention
out_dir = "data/export"
format = "ndjson"                # parquet needs `--features parquet`
hour_utc = 2
