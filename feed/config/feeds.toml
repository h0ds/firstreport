# Seed feed list for development. Spans wire services to partisan and fringe
# outlets deliberately; no outlet is excluded on quality grounds (see plan §6).

[[feed]]
url = "https://feeds.bbci.co.uk/news/world/rss.xml"
outlet = "bbc"
interval_secs = 600

[[feed]]
url = "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
outlet = "nytimes"

[[feed]]
url = "https://www.theguardian.com/world/rss"
outlet = "guardian"

[[feed]]
url = "https://feeds.washingtonpost.com/rss/world"
outlet = "washingtonpost"

[[feed]]
url = "https://moxie.foxnews.com/google-publisher/world.xml"
outlet = "foxnews"

[[feed]]
url = "https://www.aljazeera.com/xml/rss/all.xml"
outlet = "aljazeera"

[[feed]]
url = "https://feeds.npr.org/1004/rss.xml"
outlet = "npr"

[[feed]]
url = "https://feeds.feedburner.com/breitbart"
outlet = "breitbart"

[[feed]]
url = "https://www.rt.com/rss/news/"
outlet = "rt"

# AP publishes no RSS of its own (apnews.com answers 403); this third-party
# mirror links back to apnews.com articles.
[[feed]]
url = "https://feedx.net/rss/ap.xml"
outlet = "ap"

