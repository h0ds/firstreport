# Icon files for outlets whose home page `feed icons` cannot read (bot
# blocks, robots.txt on the home page, timeouts). Each URL is on the
# outlet's own domain or CDN and is fetched with the same client rules as
# everything else; it is used only when the home-page lookup finds nothing.
# Found 2026-11-22. UPI refuses every request, so it has no entry.

[[icon]]
outlet = "nytimes"
url = "https://static01.nyt.com/images/icons/ios-ipad-144x144.png"

