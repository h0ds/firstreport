[package]
name = "feed"
description = "First Report pillar 1: aggregation and story clustering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "feed"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2", "system-proxy"] }
feed-rs = "3.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
axum = "0.8.9"
whatlang = "0.18.0"
zstd = "0.14.0"
url = "2.5.8"
bytes = "1.12.1"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
arrow = { version = "60.0.0", default-features = false, optional = true }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"], optional = true }
schemars = "1"
unicode-normalization = "0.1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[features]
# Parquet export pulls in arrow; off by default.
parquet = ["dep:arrow", "dep:parquet"]
